#--------------- Custom Config - Standalone --------------------
#   Christopher Gray
#         v3.4.1
#       init 3-25-17
#    updated 9/30/2026
#------------------------------------------------------------
#   Target:  Redis 7.2+ / 8.x running in Docker (official "redis" image)
#            as a standalone in-memory cache.
#
#   Docs:    https://redis.io/docs/latest/operate/oss_and_stack/management/config/
#            https://redis.io/docs/latest/commands/
#
#   Status:
#       docker exec -it RAM_Cache0 redis-cli -p 6379 info all
#       (add:  -a <password> --no-auth-warning   when auth is enabled)
#
#   Benchmark:
#       redis-benchmark -q -n 100000 -h 127.0.0.1 -p 6379
#
#   Tests:
#       redis-server --test-memory 4096
#
#   NOTE: install_redis.sh overwrites the values of: port, maxmemory,
#         requirepass, masterauth, protected-mode, dir, logfile, daemonize,
#         supervised.  Edit everything else here.
#------------------------------------------------------------

################################## NETWORK #####################################
# Listen on all IPv4 interfaces, and on IPv6 if available ("-" = optional).
# Inside Docker this is required; restrict access with the host firewall
# (install_redis.sh adds a DOCKER-USER iptables guard) and/or requirepass.
bind * -::*

# Protected mode refuses non-loopback clients when no password is set.
# Docker traffic never arrives on loopback, so this must be "no" for an
# unauthenticated container. It is a no-op once requirepass is set.
protected-mode no

port 6379

# Needs net.core.somaxconn >= this value (the installer sets it on the container).
tcp-backlog 511

# Close idle clients after N seconds (0 = never). Long-lived pooled
# connections are the norm for app clients, so leave idle clients alone
# and let tcp-keepalive detect dead peers instead.
timeout 0
tcp-keepalive 300

# Unix sockets are not useful across a container boundary.
# unixsocket /run/redis/redis.sock
# unixsocketperm 700

################################## SECURITY ####################################
# Legacy single-password auth for the "default" user. Set by install_redis.sh
# when a password is requested. For per-app users, prefer ACLs:
#   https://redis.io/docs/latest/operate/oss_and_stack/management/security/acl/
# requirepass <password>
# masterauth  <password>

# Block runtime changes to protected configs (dir, dbfilename, ...),
# DEBUG and MODULE commands. These are common attack vectors.
enable-protected-configs no
enable-debug-command no
enable-module-command no

################################## GENERAL #####################################
# Docker supervises the process: stay in the foreground, no pidfile.
daemonize no
supervised no

loglevel notice
logfile /var/log/redis/redis.log
# syslog-enabled no

databases 16
always-show-logo no
set-proc-title yes

# Leave OOM decisions to the container memory limit.
oom-score-adj no

# Transparent huge pages cause latency and memory spikes on fork.
disable-thp yes

################################### CLIENTS ####################################
maxclients 10000

############################## MEMORY MANAGEMENT ###############################
# Hard cap on dataset memory. Keep the container limit ~25-50% higher to
# leave room for fork/copy-on-write, buffers and fragmentation.
maxmemory 1gb

# Eviction policy for a cache:
#   allkeys-lru   evict least-recently-used keys (good general default)
#   allkeys-lfu   evict least-frequently-used keys (better for skewed hot sets)
#   volatile-ttl  evict only keys with a TTL, shortest TTL first
#   noeviction    return errors on writes when full (use for queues / primary data)
maxmemory-policy allkeys-lru
maxmemory-samples 5
maxmemory-eviction-tenacity 10

# LFU tuning (only used with *-lfu policies).
# lfu-log-factor 10
# lfu-decay-time 1

############################# LAZY FREEING #####################################
# Free large values in a background thread instead of blocking the event loop.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes
replica-lazy-flush yes

################################ THREADED I/O ##################################
# Helps above ~100k ops/sec on hosts with spare cores. Leave at 1 unless
# benchmarks show a gain; never set it to more than (cores - 1).
# io-threads 4

############################### SNAPSHOTTING ###################################
# RDB snapshots (Redis 7+ default schedule): after 1h if >=1 change,
# after 5m if >=100 changes, after 60s if >=10000 changes.
# Use:  save ""   to disable persistence entirely for a pure cache.
save 3600 1 300 100 60 10000

# A cache should keep serving writes even if a snapshot fails.
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
rdb-del-sync-files no
rdb-save-incremental-fsync yes
dbfilename dump.rdb

# Data directory inside the container (host: <config path>/data).
dir /data

################################# REPLICATION ##################################
# replicaof <masterip> <masterport>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-diskless-load disabled
# repl-backlog-size 64mb
# min-replicas-to-write 1
# min-replicas-max-lag 10

############################## APPEND ONLY MODE ################################
# AOF gives at most ~1s of data loss (everysec). Off by default for a cache;
# turn on if this instance holds data you cannot rebuild.
appendonly no
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes
aof-timestamp-enabled no
aof-rewrite-incremental-fsync yes

################################ SHUTDOWN ######################################
# Give a replica / snapshot time to finish on SIGTERM (docker stop default: 10s).
shutdown-timeout 10

############################### SCRIPTING ######################################
# Max time (ms) a Lua script / function may run before Redis starts
# answering BUSY to other clients. (Replaces lua-time-limit.)
busy-reply-threshold 5000

################################ REDIS CLUSTER #################################
cluster-enabled no

################################## SLOW LOG ####################################
# Log commands slower than 10ms; keep the last 128.
slowlog-log-slower-than 10000
slowlog-max-len 128

############################### LATENCY MONITOR ################################
# Enable at runtime if needed:  CONFIG SET latency-monitor-threshold 100
latency-monitor-threshold 0
latency-tracking yes

############################# EVENT NOTIFICATION ###############################
# e.g. "Ex" to publish key-expiry events. Empty = disabled (lowest overhead).
notify-keyspace-events ""

############################### ADVANCED CONFIG ################################
# Small-collection encodings (listpack replaced ziplist in Redis 7).
hash-max-listpack-entries 128
hash-max-listpack-value 64
list-max-listpack-size -2
list-compress-depth 0
set-max-intset-entries 512
set-max-listpack-entries 128
set-max-listpack-value 64
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

activerehashing yes

# Disconnect clients that cannot keep up with pushed data.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Background task frequency; dynamic-hz raises it with many clients.
hz 10
dynamic-hz yes

########################### ACTIVE DEFRAGMENTATION #############################
# Reclaim fragmented memory on long-running caches (requires jemalloc,
# which the official image uses).
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25
jemalloc-bg-thread yes
